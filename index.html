<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#E8E8EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ECRU Fortune</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="training-bar" id="trainBar" hidden>
    <span><b>ТРЕНИРОВКА</b> · попытки не в зачёт</span>
    <button id="trainEnd">ЗАВЕРШИТЬ</button>
  </div>

  <header class="top" id="top">
    <button class="menu-btn" id="menuBtn" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="marquee">
      <span class="m-gamma">гамма</span><i>✦</i><span class="m-logo" id="logo"></span><i>✦</i><span class="m-spectra">SPECTRA</span>
    </div>
    <div class="rod"></div>
    <div class="status" id="status"></div>
  </header>

  <main id="app" data-screen="ready">
    <!-- READY / SPIN / RESULT: общий сцена-щит -->
    <section class="stage">
      <h1 class="title" id="title">FORTUNE</h1>
      <p class="subtitle" id="subtitle">Щит судьбы</p>

      <div class="reel-wrap">
        <div class="reel" id="reel"><div class="strip" id="strip"></div></div>
        <div class="glow" aria-hidden="true"></div>
      </div>

      <div class="ribbon" id="ribbon" hidden>
        <div class="ribbon-main" id="ribbonMain"></div>
        <div class="ribbon-sub" id="ribbonSub"></div>
      </div>
      <p class="draw" id="draw"></p>
      <p class="hint" id="hint"></p>
    </section>

    <section class="controls" id="controls">
      <div class="nets" id="nets" role="radiogroup" aria-label="Соцсеть"></div>
      <label class="repeat"><input type="checkbox" id="repeat"><span>2-я попытка</span></label>
      <button class="pennant-btn" id="spin" disabled><span>КРУТИТЬ</span></button>
    </section>

    <section class="after" id="after">
      <button class="pennant-btn" id="afterBtn"><span></span></button>
    </section>

    <!-- STASH -->
    <section class="stash">
      <h2 class="stash-title">НА СКЛАД</h2>
      <p class="stash-text">Отдал футболку. Возьми новую на складе и возвращайся в зал.</p>
      <p class="stash-last" id="stashLast"></p>
      <button class="pennant-btn" id="backBtn"><span>ВЗЯЛ ФУТБОЛКУ</span></button>
    </section>

    <!-- SETUP -->
    <section class="setup">
      <h2 class="setup-title">Кто ты сегодня?</h2>
      <div class="who" id="who"></div>
      <div class="fields">
        <label>Начало смены <input type="time" id="fStart"></label>
        <label>Конец смены <input type="time" id="fEnd"></label>
        <label>Футболок в квоте <input type="number" id="fQuota" min="0" max="26" inputmode="numeric"></label>
        <label class="switch"><input type="checkbox" id="fTraining"><span>Тренировка — попытки не идут в зачёт</span></label>
      </div>
      <button class="pennant-btn" id="saveBtn"><span>ГОТОВО</span></button>
      <button class="link-btn back" id="cancelBtn">← Назад без изменений</button>
      <button class="link-btn" id="resetBtn">Сбросить телефон</button>
    </section>
  </main>

  <dialog id="pinDlg">
    <form method="dialog">
      <p>PIN настроек</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
      <menu><button value="ok" id="pinOk">Открыть</button><button value="cancel" formnovalidate>Отмена</button></menu>
      <p class="ver">версия 8</p>
    </form>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script type="module" src="js/app.js"></script>
</body>
</html>
